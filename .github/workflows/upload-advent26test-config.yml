# Build advent26test api/config.php on the runner and upload that one file.
# workflow_dispatch only. The file is never committed. Do not add a push trigger.
# Does not deploy the site tree, /odkazy/, or advent26.limitlessdreams.cz.

name: Upload advent26test config

on:
  workflow_dispatch:

permissions:
  contents: none

concurrency:
  group: advent26test-config-upload
  cancel-in-progress: false

jobs:
  upload-config:
    runs-on: ubuntu-latest
    steps:
      - name: Build api/config.php from secrets
        env:
          FTP_HOST: ${{ secrets.WEDOS_FTP_HOST }}
          FTP_USER: ${{ secrets.WEDOS_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.WEDOS_FTP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.ADVENT26TEST_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.ADVENT26TEST_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ADVENT26TEST_SERVICE_ROLE_KEY }}
          ADVENT_ALLOWLIST: ${{ secrets.ADVENT26TEST_ALLOWLIST }}
        run: |
          set -euo pipefail
          export CFG="$RUNNER_TEMP/config.php"
          echo "FTP_HOST length=${#FTP_HOST}"
          echo "FTP_USER length=${#FTP_USER}"
          echo "FTP_PASSWORD length=${#FTP_PASSWORD}"
          echo "SUPABASE_URL length=${#SUPABASE_URL}"
          echo "SUPABASE_ANON_KEY length=${#SUPABASE_ANON_KEY}"
          echo "SUPABASE_SERVICE_ROLE_KEY length=${#SUPABASE_SERVICE_ROLE_KEY}"
          echo "ADVENT_ALLOWLIST length=${#ADVENT_ALLOWLIST}"
          if [ "${#FTP_HOST}" -lt 5 ] || [ "${#FTP_USER}" -lt 3 ] || [ "${#FTP_PASSWORD}" -lt 1 ]; then
            echo "Missing or empty WEDOS_FTP_* secrets"
            exit 1
          fi
          python3 << 'PY'
          import os
          from pathlib import Path

          def req(name: str) -> str:
              value = os.environ.get(name, "")
              if value == "":
                  raise SystemExit(f"Missing or empty {name}")
              if any(ch in value for ch in ("\n", "\r", "\0")):
                  raise SystemExit(f"{name} contains a newline or NUL")
              return value

          url = req("SUPABASE_URL")
          anon = req("SUPABASE_ANON_KEY")
          service = req("SUPABASE_SERVICE_ROLE_KEY")
          allow = req("ADVENT_ALLOWLIST")
          if not url.startswith("https://"):
              raise SystemExit("SUPABASE_URL must start with https://")

          def php_single(value: str) -> str:
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          guard = """if (PHP_SAPI !== 'cli' && realpath((string) ($_SERVER['SCRIPT_FILENAME'] ?? '')) === realpath(__FILE__)) {
              http_response_code(404);
              header('Content-Type: application/json; charset=utf-8');
              header('Cache-Control: no-store');
              echo '{"ok":false,"error":"not_found"}';
              exit;
          }"""

          body = f"""<?php
          declare(strict_types=1);

          /**
           * advent26test.limitlessdreams.cz server config.
           * Generated by upload-advent26test-config.yml. Do not commit.
           * Visiting this file over HTTP returns 404.
           */

          {guard}

          return [
              'ADVENT_MODE' => 'test',
              'SUPABASE_URL' => {php_single(url)},
              'SUPABASE_ANON_KEY' => {php_single(anon)},
              'SUPABASE_SERVICE_ROLE_KEY' => {php_single(service)},
              'ADVENT_ALLOWLIST' => {php_single(allow)},
              'TICKER_API_KEY' => '',
          ];
          """
          path = Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "config.php"
          cfg = os.environ.get("CFG")
          if cfg and Path(cfg) != path:
              raise SystemExit("CFG does not match RUNNER_TEMP/config.php")
          path.write_text(body)
          path.chmod(0o600)
          text = path.read_text()
          if guard not in text:
              raise SystemExit("404 guard missing from config.php")
          if "'ADVENT_MODE' => 'test'" not in text:
              raise SystemExit("ADVENT_MODE is not test")
          if "'TICKER_API_KEY' => ''" not in text:
              raise SystemExit("TICKER_API_KEY is not empty")
          for banned in ("YOUR_SUPABASE", "YOUR_PROJECT_REF"):
              if banned in text:
                  raise SystemExit("placeholder leaked into config.php")
          print("wrote config.php")
          PY
          test -f "$CFG"
          chmod 600 "$CFG"

      - name: Upload api/config.php via FTPS
        env:
          FTP_HOST: ${{ secrets.WEDOS_FTP_HOST }}
          FTP_USER: ${{ secrets.WEDOS_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.WEDOS_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          export CFG="$RUNNER_TEMP/config.php"
          test -f "$CFG"
          grep -q "http_response_code(404)" "$CFG"
          grep -q "'ADVENT_MODE' => 'test'" "$CFG"
          grep -q "'TICKER_API_KEY' => ''" "$CFG"
          echo "Uploading 1 file to domains/advent26test.limitlessdreams.cz/api/config.php on host(len=${#FTP_HOST})"
          uploaded=0
          url="ftp://${FTP_HOST}/domains/advent26test.limitlessdreams.cz/api/config.php"
          for try in $(seq 1 10); do
            if curl --ssl-reqd --ftp-pasv --ftp-skip-pasv-ip --ftp-create-dirs \
              --user "${FTP_USER}:${FTP_PASSWORD}" \
              -T "$CFG" "${url}" -o /dev/null --silent --show-error; then
              echo "OK api/config.php (try ${try})"
              uploaded=1
              break
            fi
            sleep 2
          done
          if [ "$uploaded" -ne 1 ]; then
            echo "FAIL api/config.php"
            exit 1
          fi

      - name: Delete local config.php
        if: always()
        run: |
          set -euo pipefail
          export CFG="$RUNNER_TEMP/config.php"
          rm -f "$CFG"
          if [ -e "$CFG" ]; then
            echo "config.php still present after delete"
            exit 1
          fi
          echo "local config.php deleted"
